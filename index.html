<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Collection Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #292929;
        }

        .form-container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h1 {
            margin: 0 0 12px 0;
            font-size: 36px;
            line-height: 1.1;
            font-weight: 700;
        }

        .form-header p {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
            color: #666666;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            min-height: 50px;
            padding: 12px 15px;
            border: 1px solid #c8c8c8;
            border-radius: 6px;
            font-size: 17px;
            background: #ffffff;
            color: #292929;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #666666;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: #087f83;
            color: #ffffff;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        .success {
            color: #187a3d;
        }

        .error {
            color: #b42318;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .resend-button {
            margin-top: 0;
        }

        .course-button {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="form-header">
        <h1 id="formTitle"></h1>

        <p id="formIntro"></p>
    </div>

    <form id="ispringForm">

        <!-- 1. Grade -->
        <div class="form-group">

            <label for="evfolyam" id="gradeLabel"></label>

            <select
                id="evfolyam"
                name="evfolyam"
                required
            >

                <option
                    value=""
                    id="gradePlaceholder"
                ></option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>

            </select>

        </div>


        <!-- 2. Class -->
        <div class="form-group">

            <label for="osztaly" id="classLabel"></label>

            <input
                type="text"
                id="osztaly"
                name="osztaly"
                required
            >

        </div>


        <!-- 3. Number of students -->
        <div class="form-group">

            <label for="diakokSzama" id="studentsLabel"></label>

            <input
                type="number"
                id="diakokSzama"
                name="diakokSzama"
                min="0"
                step="1"
                required
            >

        </div>


        <!-- Submit -->
        <button
            type="submit"
            id="submitButton"
        ></button>


        <!-- Status -->
        <div
            id="status"
            class="status"
        ></div>


        <!-- Post-submission buttons -->
        <div
            id="postSubmitButtons"
            class="button-group"
            style="display: none;"
        >

            <!-- Submit another -->
            <button
                type="button"
                id="resendButton"
                class="resend-button"
            ></button>


            <!-- Continue to the course -->
            <button
                type="button"
                id="courseButton"
                class="course-button"
            ></button>

        </div>

    </form>

</div>


<script>

    /*
     * ==========================================
     * LANGUAGE STRUCTURE
     * ==========================================
     *
     * Currently active language:
     * English
     *
     * Romanian can be added later without
     * changing the form logic.
     */

    const currentLanguage = "en";


    const LANGUAGES = {

        en: {

            pageTitle:
                "Data Collection Form",

            formTitle:
                "Data Collection Form",

            formIntro:
                "Please enter the following information.",

            gradeLabel:
                "1. Grade",

            gradePlaceholder:
                "Select a grade",

            classLabel:
                "2. Class (e.g. 8C, 12B)",

            classPlaceholder:
                "e.g. 8C",

            studentsLabel:
                "3. Number of students",

            submitButton:
                "Submit",

            submittingButton:
                "Submitting...",

            validationRequired:
                "Please complete all fields.",

            successMessage:
                'The data has been submitted successfully. If you would like to submit another form, click the "Submit another" button!',

            errorMessage:
                "An error occurred while submitting the data. Please try again.",

            resendButton:
                "Submit another",

            courseButton:
                "Continue to the course"

        }

        /*
         * Future:
         *
         * ro: {
         *
         *     pageTitle: "...",
         *     formTitle: "...",
         *     ...
         *
         * }
         */

    };


    const TEXTS =
        LANGUAGES[currentLanguage];


    /*
     * ==========================================
     * COURSE URL
     * ==========================================
     */

    const courseUrl =
        "https://otpfay-1278.ispring.eu/app/preview/7709856d-a82a-11f1-8c2d-c688b2cecb06";


    /*
     * ==========================================
     * APPLY LANGUAGE
     * ==========================================
     */

    document.title =
        TEXTS.pageTitle;

    document.documentElement.lang =
        currentLanguage;


    document.getElementById("formTitle").textContent =
        TEXTS.formTitle;

    document.getElementById("formIntro").textContent =
        TEXTS.formIntro;

    document.getElementById("gradeLabel").textContent =
        TEXTS.gradeLabel;

    document.getElementById("gradePlaceholder").textContent =
        TEXTS.gradePlaceholder;

    document.getElementById("classLabel").textContent =
        TEXTS.classLabel;

    document.getElementById("osztaly").placeholder =
        TEXTS.classPlaceholder;

    document.getElementById("studentsLabel").textContent =
        TEXTS.studentsLabel;

    document.getElementById("submitButton").textContent =
        TEXTS.submitButton;

    document.getElementById("resendButton").textContent =
        TEXTS.resendButton;

    document.getElementById("courseButton").textContent =
        TEXTS.courseButton;


    /*
     * ==========================================
     * FORM ELEMENTS
     * ==========================================
     */

    const form =
        document.getElementById("ispringForm");

    const button =
        document.getElementById("submitButton");

    const status =
        document.getElementById("status");

    const postSubmitButtons =
        document.getElementById("postSubmitButtons");

    const resendButton =
        document.getElementById("resendButton");

    const courseButton =
        document.getElementById("courseButton");


    /*
     * ==========================================
     * POWER AUTOMATE HTTP ENDPOINT
     * ==========================================
     */

    const powerAutomateUrl =
        "https://default003fcf5734804f89ac3a530d8d046c.be.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/14/workflows/1eb125b191aa4229b3ba3fcb9efb0663/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eWj-io2uRZCrj7GiArSwHtz7xDU4HA9ZzJvGb0Tpx_Q";


    /*
     * ==========================================
     * FORM SUBMISSION
     * ==========================================
     */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
             * Get form values
             */

            const evfolyam =
                document.getElementById("evfolyam").value;

            const osztaly =
                document
                    .getElementById("osztaly")
                    .value
                    .trim();

            const diakokSzama =
                document.getElementById("diakokSzama").value;


            /*
             * Required field validation
             */

            if (
                !evfolyam ||
                !osztaly ||
                diakokSzama === ""
            ) {

                status.textContent =
                    TEXTS.validationRequired;

                status.className =
                    "status error";

                return;
            }


            /*
             * Disable submit button
             */

            button.disabled =
                true;

            button.textContent =
                TEXTS.submittingButton;


            /*
             * Data sent to Power Automate
             *
             * IMPORTANT:
             * The data structure remains unchanged.
             */

            const data = {

                evfolyam:
                    evfolyam,

                osztaly:
                    osztaly,

                diakokSzama:
                    Number(diakokSzama),

                timestamp:
                    new Date().toISOString()

            };


            /*
             * Power Automate POST
             */

            try {

                const response =
                    await fetch(
                        powerAutomateUrl,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                /*
                 * HTTP response check
                 */

                if (!response.ok) {

                    throw new Error(
                        "HTTP error: " +
                        response.status
                    );

                }


                /*
                 * Successful submission
                 */

                status.textContent =
                    TEXTS.successMessage;

                status.className =
                    "status success";


                /*
                 * Prevent another accidental
                 * submission of the same data.
                 */

                button.style.display =
                    "none";


                /*
                 * Show both post-submission
                 * buttons only after success.
                 */

                postSubmitButtons.style.display =
                    "flex";


                console.log(
                    "Power Automate response:",
                    response.status
                );


            } catch (error) {

                /*
                 * Error handling
                 */

                console.error(
                    "Power Automate error:",
                    error
                );


                status.textContent =
                    TEXTS.errorMessage;

                status.className =
                    "status error";


                /*
                 * Allow another attempt
                 */

                button.disabled =
                    false;

                button.textContent =
                    TEXTS.submitButton;

            }

        }
    );


    /*
     * ==========================================
     * SUBMIT ANOTHER
     * ==========================================
     *
     * This button appears only after a
     * successful submission.
     *
     * It clears the previous form data and
     * allows the user to create a completely
     * new submission.
     */

    resendButton.addEventListener(
        "click",
        function() {

            /*
             * Reset all form fields
             */

            form.reset();


            /*
             * Clear status message
             */

            status.textContent =
                "";

            status.className =
                "status";


            /*
             * Hide post-submission buttons
             */

            postSubmitButtons.style.display =
                "none";


            /*
             * Show and enable Submit button
             */

            button.style.display =
                "inline-block";

            button.disabled =
                false;

            button.textContent =
                TEXTS.submitButton;


            /*
             * Put focus back on the first field
             */

            document
                .getElementById("evfolyam")
                .focus();

        }
    );


    /*
     * ==========================================
     * CONTINUE TO THE COURSE
     * ==========================================
     */

  /*
 * ==========================================
 * CONTINUE TO THE COURSE
 * ==========================================
 */

courseButton.addEventListener(
    "click",
    function() {

        window.top.location.href =
            courseUrl;

    }
);

</script>

</body>
</html>
