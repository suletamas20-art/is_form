<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adatgyűjtő űrlap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #292929;
        }

        .form-container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h1 {
            margin: 0 0 12px 0;
            font-size: 36px;
            line-height: 1.1;
            font-weight: 700;
        }

        .form-header p {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
            color: #666666;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            min-height: 50px;
            padding: 12px 15px;
            border: 1px solid #c8c8c8;
            border-radius: 6px;
            font-size: 17px;
            background: #ffffff;
            color: #292929;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #666666;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            background: #087f83;
            color: #ffffff;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        .success {
            color: #187a3d;
        }

        .error {
            color: #b42318;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="form-header">
        <h1>Adatgyűjtő űrlap</h1>

        <p>
            Kérlek, add meg az alábbi adatokat.
        </p>
    </div>

    <form id="ispringForm">

        <!-- 1. Évfolyam -->
        <div class="form-group">

            <label for="evfolyam">
                1. Évfolyam
            </label>

            <select
                id="evfolyam"
                name="evfolyam"
                required
            >

                <option value="">
                    Válassz évfolyamot
                </option>

                <option value="1">1.</option>
                <option value="2">2.</option>
                <option value="3">3.</option>
                <option value="4">4.</option>
                <option value="5">5.</option>
                <option value="6">6.</option>
                <option value="7">7.</option>
                <option value="8">8.</option>
                <option value="9">9.</option>
                <option value="10">10.</option>
                <option value="11">11.</option>
                <option value="12">12.</option>

            </select>

        </div>


        <!-- 2. Osztály -->
        <div class="form-group">

            <label for="osztaly">
                2. Osztály (például: 8C, 12B)
            </label>

            <input
                type="text"
                id="osztaly"
                name="osztaly"
                placeholder="Például: 8C"
                required
            >

        </div>


        <!-- 3. Diákok száma -->
        <div class="form-group">

            <label for="diakokSzama">
                3. Diákok száma
            </label>

            <input
                type="number"
                id="diakokSzama"
                name="diakokSzama"
                min="0"
                step="1"
                required
            >

        </div>


        <!-- Küldés -->
        <button
            type="submit"
            id="submitButton"
        >
            Küldés
        </button>


        <!-- Visszajelzés -->
        <div
            id="status"
            class="status"
        ></div>

    </form>

</div>


<script>

    const form = document.getElementById("ispringForm");

    const button = document.getElementById("submitButton");

    const status = document.getElementById("status");


    /*
     * POWER AUTOMATE HTTP VÉGPONT
     */

    const powerAutomateUrl =
        "https://default003fcf5734804f89ac3a530d8d046c.be.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/14/workflows/1eb125b191aa4229b3ba3fcb9efb0663/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eWj-io2uRZCrj7GiArSwHtz7xDU4HA9ZzJvGb0Tpx_Q";


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const evfolyam =
            document.getElementById("evfolyam").value;

        const osztaly =
            document.getElementById("osztaly").value.trim();

        const diakokSzama =
            document.getElementById("diakokSzama").value;


        /*
         * Kötelező mezők ellenőrzése
         */

        if (
            !evfolyam ||
            !osztaly ||
            diakokSzama === ""
        ) {

            status.textContent =
                "Kérlek, töltsd ki az összes mezőt.";

            status.className =
                "status error";

            return;
        }


        /*
         * Gomb ideiglenes tiltása
         */

        button.disabled = true;

        button.textContent =
            "Küldés...";


        /*
         * Az elküldendő adatok
         */

        const data = {

            evfolyam:
                evfolyam,

            osztaly:
                osztaly,

            diakokSzama:
                Number(diakokSzama),

            timestamp:
                new Date().toISOString()

        };


        /*
         * Power Automate POST
         */

        try {

            const response =
                await fetch(
                    powerAutomateUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            /*
             * HTTP válasz ellenőrzése
             */

            if (!response.ok) {

                throw new Error(
                    "HTTP hiba: " +
                    response.status
                );

            }


            /*
             * Sikeres küldés
             */

            status.textContent =
                "Az adatok sikeresen elküldve.";

            status.className =
                "status success";


            console.log(
                "Power Automate válasz:",
                response.status
            );


        } catch (error) {

            /*
             * Hiba kezelése
             */

            console.error(
                "Power Automate hiba:",
                error
            );


            status.textContent =
                "Hiba történt az adatok elküldésekor. Kérlek, próbáld újra.";

            status.className =
                "status error";

        }


        /*
         * Gomb visszaállítása
         */

        button.disabled = false;

        button.textContent =
            "Küldés";

    });

</script>

</body>
</html>
