<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Collection Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <div class="form-header">
        <h1 id="formTitle"></h1>

        <p id="formIntro"></p>
    </div>

    <form id="ispringForm">

        <!-- 1. Grade -->
        <div class="form-group">

            <label for="evfolyam" id="gradeLabel"></label>

            <select
                id="evfolyam"
                name="evfolyam"
                required
            >

                <option
                    value=""
                    id="gradePlaceholder"
                ></option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>

            </select>

        </div>


        <!-- 2. Class -->
        <div class="form-group">

            <label for="osztaly" id="classLabel"></label>

            <input
                type="text"
                id="osztaly"
                name="osztaly"
                required
            >

        </div>


        <!-- 3. Number of students -->
        <div class="form-group">

            <label for="diakokSzama" id="studentsLabel"></label>

            <input
                type="number"
                id="diakokSzama"
                name="diakokSzama"
                min="0"
                step="1"
                required
            >

        </div>


        <!-- Submit -->
        <button
            type="submit"
            id="submitButton"
        ></button>


        <!-- Status -->
        <div
            id="status"
            class="status"
        ></div>


        <!-- Post-submission buttons -->
        <div
            id="postSubmitButtons"
            class="button-group"
            style="display: none;"
        >

            <!-- Submit another -->
            <button
                type="button"
                id="resendButton"
                class="resend-button"
            ></button>


            <!-- Continue to the course -->
            <button
                type="button"
                id="courseButton"
                class="course-button"
            ></button>

        </div>

    </form>

</div>


<script src="script.js"></script>

</body>
</html>
